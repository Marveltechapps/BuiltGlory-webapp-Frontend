name: Config check
on:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-public-env.mjs --file .env.production.example
      - run: node scripts/validate-public-env.mjs --file .env.staging.example
